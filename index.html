<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мій CodeLife - Архів Форматів та Кодів</title>
    <style>
        body {
            background-color: #03060f;
            background-image: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            margin: 0; min-height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .planet { position: absolute; border-radius: 50%; z-index: 1; background: radial-gradient(circle at 30% 30%, #fff, #444); box-shadow: 0 0 40px rgba(255,255,255,0.2); pointer-events: none; }
        .p1 { width: 140px; height: 140px; top: 10%; right: 10%; }
        .p2 { width: 90px; height: 90px; bottom: 15%; left: 8%; }
        .p3 { width: 110px; height: 110px; top: 25%; left: 18%; }
        .orb { position: absolute; width: 25px; height: 25px; background: #00f0ff; border-radius: 50%; z-index: 0; filter: blur(3px); transition: all 5s linear; pointer-events: none; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; width: 90%; max-width: 1000px; margin-top: 50px; z-index: 2; position: relative; }
        .card { background: rgba(10, 14, 23, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 25px; text-align: center; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: #00f0ff; box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }
        h2 { font-size: 1.1rem; margin: 10px 0; color: white; }
        p { font-size: 0.9rem; color: #bbc4d0; }

        #modal-window { display: none; position: fixed; top: 30%; left: 30%; width: 40%; background: rgba(10, 14, 23, 0.98); border: 2px solid #00f0ff; border-radius: 15px; z-index: 10; padding: 30px; color: white; text-align: center; box-shadow: 0 0 30px rgba(0, 240, 255, 0.5); }
        .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; color: #ff4444; font-weight: bold; }
        input[type="password"] { padding: 10px; width: 200px; border-radius: 5px; border: 1px solid #00f0ff; background: #03060f; color: white; text-align: center; }
        .submit-btn { margin-top: 15px; padding: 10px 20px; background: #0088ff; color: white; border-radius: 8px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="planet p1"></div><div class="planet p2"></div><div class="planet p3"></div>
    <div class="orb" id="o1"></div><div class="orb" id="o2"></div><div class="orb" id="o3"></div>

    <div id="modal-window">
        <span class="close-btn" onclick="document.getElementById('modal-window').style.display='none'">[X]</span>
        <div id="modal-content"></div>
    </div>

    <main class="cards-grid">
        <div class="card" onclick="requestPassword('books')"><h2>📚 Мої Книги</h2><p>PDF, DOCX, TXT</p></div>
        <div class="card" onclick="requestPassword('media')"><h2>🎬 Медіафайли</h2><p>MP4, MP3</p></div>
        <div class="card" onclick="requestPassword('software')"><h2>💻 Мої Софт & Коди</h2><p>EXE, ASM, PY</p></div>
        <div class="card" onclick="requestPassword('photos')"><h2>📸 Мої Світлини</h2><p>JPG, PNG</p></div>
        <div class="card" onclick="openPublic()"><h2>✨ Цікаве для всіх!</h2><p>Вільний вхід</p></div>
    </main>

    <script>
        const SECRET_PASSWORD = "11111968";
        const database = {
            books: "https://drive.google.com/drive/folders/1CfXdTjx0Ib7ST21TBDy1Hg2-QdcvzFMO?usp=drive_link",
            media: "https://drive.google.com/drive/folders/15HgC3XhSLDvjo2pQLROdoFJLj0tpfcGb?usp=drive_link",
            software: "https://drive.google.com/drive/folders/18lHjjyJfPgzTG5XYSVPAyKmAlX-RU5Ii?usp=drive_link",
            photos: "https://drive.google.com/drive/folders/10fMK4fULL_EBsKMxKajMf29YheouXoKh?usp=drive_link",
            public: "https://drive.google.com/drive/folders/1LPZOGhXmUkf0KjLIBKTXm_TwQxKgDGuv?usp=drive_link"
        };

        function requestPassword(category) {
            document.getElementById('modal-window').style.display = 'block';
            document.getElementById('modal-content').innerHTML = `
                <h3>🔒 Введіть пароль</h3>
                <input type="password" id="passInput" placeholder="Пароль">
                <br><button class="submit-btn" onclick="check('${category}')">Увійти</button>
                <p id="error" style="color:red; margin-top:10px;"></p>
            `;
            // Додаємо можливість натиснути Enter для входу
            document.getElementById('passInput').onkeydown = function(e) {
                if(e.key === 'Enter') check(category);
            };
        }

        function check(category) {
            const pass = document.getElementById('passInput').value;
            if(pass === SECRET_PASSWORD) {
                window.open(database[category], '_blank');
                document.getElementById('modal-window').style.display = 'none';
            } else {
                document.getElementById('error').innerText = "Невірний пароль!";
            }
        }

        function openPublic() { 
            window.open(database.public, '_blank'); 
        }

        // Анімація кульок
        setInterval(() => {
            document.querySelectorAll('.orb').forEach(o => {
                o.style.left = (Math.random()*90)+'vw'; 
                o.style.top = (Math.random()*90)+'vh';
            });
        }, 4000);
    </script>
</body>
</html>
