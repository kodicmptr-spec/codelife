<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мій CodeLife - Закрита База</title>
    <style>
        body {
            background-color: #03060f;
            background-image: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            margin: 0; min-height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Планети фону */
        .planet { position: absolute; border-radius: 50%; z-index: 1; 
                  background: radial-gradient(circle at 30% 30%, #fff, #444);
                  box-shadow: 0 0 40px rgba(255,255,255,0.2); pointer-events: none; }
        .p1 { width: 140px; height: 140px; top: 10%; right: 10%; }
        .p2 { width: 90px; height: 90px; bottom: 15%; left: 8%; }
        .p3 { width: 110px; height: 110px; top: 25%; left: 18%; }

        /* Кульки (рандомний рух) */
        .orb { position: absolute; width: 25px; height: 25px; background: #00f0ff; 
               border-radius: 50%; z-index: 0; filter: blur(3px);
               transition: all 5s linear; pointer-events: none; }

        /* Сітка карток */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
                      gap: 20px; width: 90%; max-width: 1000px; margin-top: 50px; 
                      z-index: 2; position: relative; }
        
        .card { background: rgba(10, 14, 23, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); 
                border-radius: 12px; padding: 25px; text-align: center; cursor: pointer;
                transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s; }
        
        .card:hover { 
            transform: translateY(-5px); 
            border-color: #00f0ff; 
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); 
        }
        
        h2 { font-size: 1.1rem; margin: 10px 0; color: white; }
        p { font-size: 0.9rem; color: #bbc4d0; }

        /* Модальне вікно */
        #modal-window { 
            display: none; position: fixed; top: 15%; left: 20%; width: 60%; height: 65%; 
            background: rgba(10, 14, 23, 0.98); border: 2px solid #00f0ff; border-radius: 15px; 
            z-index: 10; padding: 30px; color: white; text-align: center; box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
            overflow-y: auto;
        }
        .close-btn { position: absolute; top: 15px; right: 20px; cursor: pointer; color: #ff4444; font-weight: bold; font-size: 18px; }
        
        /* Поля вводу та кнопки */
        .password-box { margin-top: 40px; }
        input[type="password"] { padding: 10px; width: 200px; border-radius: 5px; border: 1px solid #00f0ff; background: #03060f; color: white; text-align: center; font-size: 1rem; }
        .submit-btn, .action-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #0088ff; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover, .action-btn:hover { background: #00f0ff; color: #03060f; box-shadow: 0 0 15px #00f0ff; }
        
        .file-list { margin-top: 20px; text-align: left; display: inline-block; }
        .file-item { margin: 10px 0; background: rgba(0, 240, 255, 0.1); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(0, 240, 255, 0.3); }
        .file-item a { color: #00f0ff; text-decoration: none; font-weight: bold; }
        .file-item a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="planet p1"></div><div class="planet p2"></div><div class="planet p3"></div>
    <div class="orb" id="o1"></div><div class="orb" id="o2"></div><div class="orb" id="o3"></div>

    <!-- Універсальне модальне вікно -->
    <div id="modal-window">
        <span class="close-btn" onclick="closeModal()">[X] ЗАКРИТИ</span>
        <div id="modal-content"></div>
    </div>

    <!-- Робочий стіл з кнопками -->
    <main class="cards-grid">
        <div class="card" onclick="requestPassword('books')">
            <h2>📚 Мої Книги</h2>
            <p>Текстові файли (Тільки для друзів)</p>
        </div>

        <div class="card" onclick="requestPassword('media')">
            <h2>🎬 Медіафайли</h2>
            <p>Відео та аудіо (Секретно)</p>
        </div>

        <div class="card" onclick="requestPassword('software')">
            <h2>💻 Мої Софт & Коди</h2>
            <p>Програми та скрипти (.exe, код)</p>
        </div>

        <div class="card" onclick="requestPassword('photos')">
            <h2>📸 Мої Світлини</h2>
            <p>Фотографії та картини</p>
        </div>

        <div class="card" onclick="openPublic()">
            <h2>✨ Цікаве для всіх!</h2>
            <p>Відкритий доступ для всіх</p>
        </div>
    </main>

    <script>
        // Секретний пароль (можеш змінити на будь-який)
        const SECRET_PASSWORD = "2026";

        // База даних твоїх секретних та публічних файлів (заміниш посилання на свої)
        const database = {
            books: [
                { name: "📖 Моя книга (PDF)", link: "https://drive.google.com/" },
                { name: "📝 Стаття про код (.docx)", link: "https://drive.google.com/" }
            ],
            media: [
                { name: "🎵 Ексклюзивний трек (Audio)", link: "https://drive.google.com/" },
                { name: "🎬 Закритий відеоролик (MP4)", link: "https://www.youtube.com/" }
            ],
            software: [
                { name: "💻 Моя програма (.exe)", link: "https://drive.google.com/" },
                { name: "⚙️ Скрипт автоматизації (Python)", link: "https://github.com/" }
            ],
            photos: [
                { name: "📸 Цифровий арт №1 (JPG)", link: "https://photos.google.com/" },
                { name: "🌄 Робочий стіл космос (PNG)", link: "https://photos.google.com/" }
            ],
            public: [
                { name: "✨ Публічна цікавинка 1", link: "https://github.com/" },
                { name: "🌍 Відкритий файл для всіх", link: "https://google.com/" }
            ]
        };

        // Анімація кульок
        function moveOrbs() {
            document.querySelectorAll('.orb').forEach(orb => {
                orb.style.left = (Math.random() * 90) + 'vw';
                orb.style.top = (Math.random() * 90) + 'vh';
            });
        }
        setInterval(moveOrbs, 4000);
        moveOrbs();

        // Запит пароля для секретних розділів
        function requestPassword(category) {
            const modal = document.getElementById('modal-window');
            const content = document.getElementById('modal-content');
            
            modal.style.display = 'block';
            content.innerHTML = `
                <h2 style="margin-top:20px; color:#00f0ff;">🔒 Секретний розділ</h2>
                <p>Цей розділ тільки для друзів. Введіть пароль:</p>
                <div class="password-box">
                    <input type="password" id="passInput" placeholder="Пароль">
                    <br>
                    <button class="submit-btn" onclick="checkPassword('${category}')">Увійти</button>
                </div>
                <p id="errorMsg" style="color:#ff4444; margin-top:10px;"></p>
            `;
        }

        // Перевірка пароля
        function checkPassword(category) {
            const enteredPass = document.getElementById('passInput').value;
            if (enteredPass === SECRET_PASSWORD) {
                showFiles(category);
            } else {
                document.getElementById('errorMsg').innerText = "Невірний пароль! Спробуй ще.";
            }
        }

        // Відображення файлів після успішного вводу пароля
        function showFiles(category) {
            const content = document.getElementById('modal-content');
            let html = `<h2 style="margin-top:20px; color:#00f0ff;">📁 Архів файлів</h2><div class="file-list">`;
            
            database[category].forEach(file => {
                html += `
                    <div class="file-item">
                        📄 <strong>${file.name}</strong><br>
                        <a href="${file.link}" target="_blank">📥 Завантажити / Переглянути</a>
                    </div>
                `;
            });
            html += `</div>`;
            content.innerHTML = html;
        }

        // Відкриття публічного розділу (без пароля)
        function openPublic() {
            const modal = document.getElementById('modal-window');
            const content = document.getElementById('modal-content');
            
            modal.style.display = 'block';
            let html = `<h2 style="margin-top:20px; color:#00f0ff;">✨ Цікаве для всіх!</h2><p>Відкритий доступ для кожного:</p><div class="file-list">`;
            
            database.public.forEach(file => {
                html += `
                    <div class="file-item">
                        🌟 <strong>${file.name}</strong><br>
                        <a href="${file.link}" target="_blank">🔗 Відкрити посилання</a>
                    </div>
                `;
            });
            html += `</div>`;
            content.innerHTML = html;
        }

        function closeModal() {
            document.getElementById('modal-window').style.display = 'none';
        }
    </script>
</body>
</html>
